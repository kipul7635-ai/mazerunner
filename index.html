<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Path Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: 'Press Start 2P', 'Lucida Console', 'Monaco', 'Consolas', 'Courier New', monospace;
    font-weight: normal;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    font-variant-ligatures: none;
    transition: background .5s;
    -webkit-font-smoothing: none;
    font-smooth: never;
    text-rendering: geometricPrecision;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    font-size: 9px; letter-spacing: 2px;
    pointer-events: none;
    text-transform: uppercase;
    transition: color .5s;
    line-height: 1.6;
  }
  #hud b { font-weight: normal; letter-spacing: 2px; }

  /* ---- combo counter (top left, under LEVEL) ---- */
  #combo {
    position: fixed; top: 44px; left: 16px;
    font-size: 13px; letter-spacing: 2px;
    pointer-events: none;
    text-transform: uppercase;
    opacity: 0;
    transform-origin: left center;
    transition: opacity .18s, color .5s;
    text-shadow: 0 0 12px currentColor;
  }
  #combo.on { opacity: 1; }
  #combo.pop { animation: comboPop .32s cubic-bezier(.2,1.7,.4,1); }
  @keyframes comboPop {
    0%   { transform: scale(1.9); }
    60%  { transform: scale(.94); }
    100% { transform: scale(1); }
  }

  #timer {
    position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; letter-spacing: 1px;
    pointer-events: none;
    text-transform: uppercase;
    transition: color .5s;
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  #timer .par {
    color: rgba(255,255,255,0.35);
    font-size: 8px;
    letter-spacing: 1px;
  }
  #timer .tminus {
    font-size: 9px;
    letter-spacing: 1px;
  }
  #timer .tminus.over {
    color: #ff5566;
  }

  /* ---- t-minus depletion bar (below the timers) ---- */
  #tbar {
    position: fixed;
    top: 37px;
    left: 50%;
    transform: translateX(-50%);
    width: 212px;
    height: 3px;
    background: rgba(255,255,255,0.10);
    border-radius: 2px;
    overflow: hidden;
    pointer-events: none;
    transition: background .5s;
  }
  #tbarFill {
    height: 100%;
    width: 100%;
    border-radius: 2px;
    background: #4fa8ff;
    transition: background .5s;
    will-change: width;
  }

  #msg {
    position: fixed; left: 0; right: 0; top: 42%;
    text-align: center;
    font-size: 16px; letter-spacing: 5px;
    pointer-events: none; opacity: 0;
    transition: opacity .1s, color .5s;
    text-transform: uppercase;
  }
  #msg.on { opacity: 1; }
  #hint {
    position: fixed; bottom: 14px; left: 0; right: 0;
    text-align: center;
    font-size: 7px; letter-spacing: 2px;
    pointer-events: none; opacity: .55;
    text-transform: uppercase;
    transition: color .5s, opacity .5s;
  }

  /* ---- buttons ---- */
  #btnWrap {
    position: fixed; left: 50%; top: 56%;
    transform: translate(-50%,-50%);
    display: flex; flex-direction: column;
    gap: 14px; align-items: center;
    pointer-events: none;
    z-index: 5;
  }
  #btn, #btn2 {
    font-family: inherit;
    font-weight: normal;
    text-transform: uppercase;
    color: #fff;
    background: rgba(0,0,0,0.35);
    border: 2px solid currentColor;
    border-radius: 3px;
    cursor: pointer;
    outline: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity .1s, transform .1s, color .5s, box-shadow .1s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }
  #btn {
    padding: 16px 30px;
    font-size: 9px;
    letter-spacing: 3px;
    transform: scale(.88);
  }
  #btn.on {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  #btn2 {
    padding: 9px 18px;
    font-size: 7px;
    letter-spacing: 2px;
    border-width: 1px;
    transform: scale(.88);
  }
  #btn2.on {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  #btn:hover, #btn:focus, #btn2:hover, #btn2:focus {
    box-shadow: 0 0 22px currentColor;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="combo"></div>
<div id="timer">
  <span id="tCur">00:000</span>
  <span class="par" id="tPar">/ 00:000</span>
  <span class="tminus" id="tMinus">T-00:000</span>
</div>
<div id="tbar"><div id="tbarFill"></div></div>
<div id="msg"></div>
<div id="btnWrap">
  <button id="btn" type="button"></button>
  <button id="btn2" type="button"></button>
</div>
<div id="hint">◀ tap left &nbsp;·&nbsp; tap right ▶ &nbsp;·&nbsp; hold both = boost</div>
<script>
(function(){
'use strict';

const cv      = document.getElementById('c');
const ctx     = cv.getContext('2d');
const hudEl   = document.getElementById('hud');
const comboEl = document.getElementById('combo');
const timerEl = document.getElementById('timer');
const tCurEl  = document.getElementById('tCur');
const tParEl  = document.getElementById('tPar');
const tMinEl  = document.getElementById('tMinus');
const tbarEl  = document.getElementById('tbar');
const tbarFil = document.getElementById('tbarFill');
const msgEl   = document.getElementById('msg');
const hintEl  = document.getElementById('hint');
const btnEl   = document.getElementById('btn');
const btn2El  = document.getElementById('btn2');

/* offscreen render target (used for the globe warp) */
const off  = document.createElement('canvas');
const octx = off.getContext('2d');

let CW = 0, CH = 0;

/* ============================================================= */
/*  THEME  —  walls use the SAME colour as the accent            */
/* ============================================================= */
let hue = 200;
let accent     = 'hsl(200,95%,62%)';
let accentSoft = 'hsla(200,95%,62%,0.55)';
let wallColor  = 'hsl(200,95%,62%)';
let wallGlow   = 'hsla(200,95%,62%,0.13)';
let bgBase     = 'hsl(200,40%,4%)';

function applyTheme(){
  accent     = 'hsl(' + hue + ',95%,62%)';
  accentSoft = 'hsla(' + hue + ',95%,62%,0.55)';
  wallColor  = accent;
  wallGlow   = 'hsla(' + hue + ',95%,62%,0.13)';
  bgBase     = 'hsl(' + hue + ',40%,4%)';

  document.body.style.background = bgBase;
  hudEl.style.color   = 'hsla(' + hue + ',60%,38%,1)';
  timerEl.style.color = accent;
  msgEl.style.color   = accent;
  hintEl.style.color  = accentSoft;
  btnEl.style.color   = accent;
  btn2El.style.color  = accent;
  comboEl.style.color = accent;
  tbarFil.style.background = accent;

  const b = hudEl.querySelector('b');
  if(b) b.style.color = accent;
}

function pickColors(){
  hue = Math.floor(Math.random() * 360);
  applyTheme();
}

/* ============================================================= */
/*  AUDIO  —  8 looping stems, layered by combo streak           */
/* ============================================================= */
/*
   PADS  DRUMS  KICK  BASS  PERCS  NOISE  LEAD  LEADS

   Every stem is started at exactly the same moment and loops
   forever, so they are always sample-locked to one another.
   A stem's audibility is controlled purely with gain + a
   lowpass "muffle" filter, which lets us fade a layer in at any
   point in the run without ever breaking the sync.

   Band width is 5 combos, stretched by 30%  ->  6.5
      combo  0 ..  6.5   pads   (quiet+muffled  ->  clear)
      combo  6.5 .. 13   drums
      combo 13 .. 19.5   kick
      combo 19.5 .. 26   bass
      combo 26 .. 32.5   percs
      combo 32.5 .. 39   noise
      combo 39 .. 45.5   lead
      combo 45.5 .. 52   leads
*/
const AUDIO_NAMES = ['PADS','DRUMS','KICK','BASS','PERCS','NOISE','LEAD','LEADS'];
const AUDIO_MAX   = [ 0.55,  0.42,  0.50, 0.45,  0.34,  0.24,  0.30,  0.30 ];
const COMBO_BAND  = 6.5;     /* 5 * 1.3  */
const QUIET_MUL   = 0.20;    /* level of a freshly-joined stem */
const FREQ_LO     = 380;     /* muffled cutoff  */
const FREQ_HI     = 19000;   /* wide-open cutoff */

const audio = {
  ctx:     null,
  master:  null,
  tracks:  [],
  ready:   false,
  loading: false,
  failed:  false,
  wantOn:  false
};

function decodeAB(actx, ab){
  return new Promise(function(res, rej){
    let done = false;
    const ok = function(b){ if(!done){ done = true; res(b); } };
    const no = function(e){ if(!done){ done = true; rej(e); } };
    const p = actx.decodeAudioData(ab, ok, no);
    if(p && typeof p.then === 'function') p.then(ok, no);
  });
}

function initAudio(){
  if(audio.ready || audio.loading || audio.failed) return;
  audio.loading = true;

  let actx;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ audio.failed = true; audio.loading = false; return; }
    actx = new AC();
  }catch(e){
    audio.failed = true; audio.loading = false; return;
  }

  audio.ctx = actx;
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(_){} }

  const master = actx.createGain();
  master.gain.value = 0;

  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -8;
  comp.knee.value      = 6;
  comp.ratio.value     = 8;
  comp.attack.value    = 0.004;
  comp.release.value   = 0.20;

  master.connect(comp);
  comp.connect(actx.destination);
  audio.master = master;

  Promise.all(AUDIO_NAMES.map(function(name){
    return fetch(name + '.ogg')
      .then(function(r){
        if(!r.ok) throw new Error(name + '.ogg ' + r.status);
        return r.arrayBuffer();
      })
      .then(function(ab){ return decodeAB(actx, ab); });
  })).then(function(buffers){

    const tracks = [];
    for(let i = 0; i < buffers.length; i++){
      const g = actx.createGain();
      g.gain.value = 0;

      const f = actx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = FREQ_LO;
      f.Q.value = 0.7;

      g.connect(f);
      f.connect(master);

      tracks.push({ name: AUDIO_NAMES[i], buf: buffers[i], gain: g, filt: f, src: null });
    }

    /* everything starts at the SAME instant -> permanent sync */
    const t0 = actx.currentTime + 0.10;
    for(let i = 0; i < tracks.length; i++){
      const src = actx.createBufferSource();
      src.buffer = tracks[i].buf;
      src.loop   = true;
      src.connect(tracks[i].gain);
      try{ src.start(t0, 0); }catch(_){}
      tracks[i].src = src;
    }

    audio.tracks  = tracks;
    audio.ready   = true;
    audio.loading = false;

    updateMusicMix(true);
    setMusicOn(audio.wantOn);

  }).catch(function(e){
    console.warn('Audio load failed:', e);
    audio.failed  = true;
    audio.loading = false;
    audio.ready   = false;
  });
}

function updateMusicMix(force){
  if(!audio.ready || !audio.ctx || !audio.tracks.length) return;

  const now   = audio.ctx.currentTime;
  const combo = G.combo;
  const tc    = force ? 0.0001 : 0.35;
  const tcF   = force ? 0.0001 : 0.50;

  for(let i = 0; i < audio.tracks.length; i++){
    const tr        = audio.tracks[i];
    const bandStart = COMBO_BAND * i;
    const bandEnd   = bandStart + COMBO_BAND;

    /* pads are always present, everything else waits its turn */
    const active = (i === 0) || (combo > bandStart);

    let prog = 0;
    if(combo >= bandEnd)        prog = 1;
    else if(combo > bandStart)  prog = (combo - bandStart) / COMBO_BAND;

    let g, fq;
    if(!active){
      g  = 0;
      fq = FREQ_LO;
    } else {
      const m = AUDIO_MAX[i];
      g  = m * (QUIET_MUL + (1 - QUIET_MUL) * prog);
      fq = FREQ_LO * Math.pow(FREQ_HI / FREQ_LO, prog);
    }

    tr.gain.gain.setTargetAtTime(g, now, tc);
    tr.filt.frequency.setTargetAtTime(fq, now, tcF);
  }
}

function setMusicOn(on){
  audio.wantOn = on;
  if(!audio.ready || !audio.master) return;
  const now = audio.ctx.currentTime;
  audio.master.gain.setTargetAtTime(on ? 0.9 : 0, now, 0.35);
}

/* ============================================================= */
/*  GLOBE WARP (precomputed per resize)                          */
/* ============================================================= */
const WARP_GRID = 24;
const WARP_K    = 0.50;      /* curvature strength               */
let warpTable  = null;
let warpCellW  = 0;
let warpCellH  = 0;

function buildWarpTable(){
  const N = WARP_GRID;
  const cellW = CW / N;
  const cellH = CH / N;
  const ccx = CW * 0.5;
  const ccy = CH * 0.5;
  const refD = Math.sqrt(ccx*ccx + ccy*ccy);

  const arr = new Float32Array(N * N * 4);
  let k = 0;
  for(let j = 0; j < N; j++){
    for(let i = 0; i < N; i++){
      const scx = (i + 0.5) * cellW - ccx;
      const scy = (j + 0.5) * cellH - ccy;
      const d = Math.sqrt(scx*scx + scy*scy);

      let sc;
      if(d < 0.001) sc = 1;
      else {
        const t = d / refD;
        sc = 1 - WARP_K * t * t;
      }

      const dcx = ccx + scx * sc;
      const dcy = ccy + scy * sc;
      const dw  = cellW * sc;
      const dh  = cellH * sc;

      /* slight overdraw hides tiny seams between cells */
      arr[k++] = dcx - dw * 0.5 - 1.5;
      arr[k++] = dcy - dh * 0.5 - 1.5;
      arr[k++] = dw + 3.0;
      arr[k++] = dh + 3.0;
    }
  }

  warpTable = arr;
  warpCellW = cellW;
  warpCellH = cellH;
}

function warpBlit(){
  const N  = WARP_GRID;
  const cw = warpCellW;
  const ch = warpCellH;
  let k = 0;
  for(let j = 0; j < N; j++){
    const sy = j * ch;
    for(let i = 0; i < N; i++){
      const sx = i * cw;
      ctx.drawImage(off,
        sx, sy, cw, ch,
        warpTable[k], warpTable[k+1], warpTable[k+2], warpTable[k+3]);
      k += 4;
    }
  }
}

/* ============================================================= */
/*  RESIZE                                                       */
/* ============================================================= */
function resize(){
  CW = cv.width  = window.innerWidth;
  CH = cv.height = window.innerHeight;
  off.width  = CW;
  off.height = CH;
  buildWarpTable();
}
addEventListener('resize', resize);

/* ============================================================= */
/*  STATE                                                        */
/* ============================================================= */
const G = {
  level: 1,
  state: 'menu',      /* 'menu' | 'play' | 'dead' | 'win' */
  levelTime: 0,
  parTime: 10,
  shake: 0,
  maxSpeed: 210,
  boosting: false,
  combo: 0,
  comboBroken: false
};

/* Direction constants: 0=right, 1=down, 2=left, 3=up */
const DIR_VEC = [[1,0],[0,1],[-1,0],[0,-1]];
const DIR_ANG = [0, Math.PI/2, Math.PI, -Math.PI/2];

let segs     = [];   // flat straight wall segments  x1,y1,x2,y2
let buckets  = new Map();
const BUCKET = 128;
const BPAD   = 44;

let W = 0, H = 0;
let s = 200;

let wallGlowW = 10;
let wallCoreW = 2;

let path       = [];
let pathIdxMap = new Map();

const player = { x:0, y:0, r:2.2, ang:0, dir:0 };
let visAng = 0;

let trail = [];

let goalCell  = { x:0, y:0 };
let goalX = 0, goalY = 0;
let startCell = { x:0, y:0 };
let goalWall  = null;

let navAngle       = 0;
let navAngleTarget = 0;
let navCell        = { x:-1, y:-1 };

const cam = { x:0, y:0 };

/* ============================================================= */
/*  STARFIELD  —  only outside the maze bounding box             */
/* ============================================================= */
let stars = [];

function generateStars(){
  stars = [];

  const mazeW = W * s;
  const mazeH = H * s;

  /* how far the starfield extends past the maze on all sides */
  const MARGIN = Math.max(2800, mazeW * 0.55);

  const minX = -MARGIN;
  const maxX = mazeW + MARGIN;
  const minY = -MARGIN;
  const maxY = mazeH + MARGIN;

  const totalArea = (maxX - minX) * (maxY - minY);
  const mazeArea  = mazeW * mazeH;
  const voidArea  = Math.max(1, totalArea - mazeArea);

  /* noticeably more stars per unit area than before */
  const density = 1 / 11000;
  const targetCount = Math.min(9000, Math.floor(voidArea * density));

  let attempts = 0;
  const maxAttempts = targetCount * 8;

  while(stars.length < targetCount && attempts < maxAttempts){
    attempts++;
    const x = minX + Math.random() * (maxX - minX);
    const y = minY + Math.random() * (maxY - minY);

    /* reject anything inside the maze footprint */
    if(x >= 0 && x <= mazeW && y >= 0 && y <= mazeH) continue;

    const size  = 0.6 + Math.random() * 2.0;
    const alpha = 0.25 + Math.random() * 0.65;
    stars.push({ x: x, y: y, s: size, a: alpha });
  }
}

/* ============================================================= */
/*  BOOST + ACCELERATION RAMP                                    */
/* ============================================================= */
const BOOST_MULT_BASE    = 1.8;
const BOOST_HOLD_REFRESH = 0.30;
const BOOST_RAMP_RATE    = 0.55;
const BOOST_RAMP_MAX     = 3.2;

let boostTime  = 0;
let boostPrev  = false;
let boostGlow  = 0;
let boostRamp  = 0;
let shockwaves = [];

function currentBoostMult(){
  return BOOST_MULT_BASE + boostRamp;
}

/* ============================================================= */
/*  BUTTONS                                                      */
/* ============================================================= */
let primaryAction   = null;
let secondaryAction = null;

function showPrimary(label, action){
  primaryAction = action;
  btnEl.textContent = label;
  btnEl.classList.add('on');
}
function hidePrimary(){
  primaryAction = null;
  btnEl.classList.remove('on');
}
function showSecondary(label, action){
  secondaryAction = action;
  btn2El.textContent = label;
  btn2El.classList.add('on');
}
function hideSecondary(){
  secondaryAction = null;
  btn2El.classList.remove('on');
}
function hideAllButtons(){
  hidePrimary();
  hideSecondary();
}

btnEl.addEventListener('click', function(e){
  e.preventDefault();
  e.stopPropagation();
  const a = primaryAction;
  hideAllButtons();
  if(a === 'start'){
    /* begin the run — this is also the user gesture that unlocks audio */
    initAudio();
    setMusicOn(true);
    G.state = 'play';
    G.levelTime = 0;
    resetTimerCache();
  } else if(a === 'restart'){
    resetLevel();
  } else if(a === 'continue'){
    G.level++;
    buildLevel();
  }
});

btn2El.addEventListener('click', function(e){
  e.preventDefault();
  e.stopPropagation();
  const a = secondaryAction;
  hideAllButtons();
  if(a === 'menu'){
    goToMenu();
  }
});

/* ============================================================= */
/*  INPUT  (instant 90° turns)                                   */
/* ============================================================= */
const keys     = new Set();
const pointers = new Map();

const KEYMAP = {
  ArrowLeft:'left', ArrowRight:'right',
  a:'left', d:'right', A:'left', D:'right'
};

function turnLeft(){
  player.dir = (player.dir + 3) & 3;
  player.ang = DIR_ANG[player.dir];
}
function turnRight(){
  player.dir = (player.dir + 1) & 3;
  player.ang = DIR_ANG[player.dir];
}

addEventListener('keydown', function(e){
  if((e.key === 'Enter' || e.key === ' ') && primaryAction){
    e.preventDefault();
    btnEl.click();
    return;
  }
  const k = KEYMAP[e.key];
  if(!k) return;
  e.preventDefault();
  if(G.state !== 'play') return;
  if(keys.has(k)) return;
  keys.add(k);
  if(k === 'left')  turnLeft();
  else              turnRight();
});
addEventListener('keyup', function(e){
  const k = KEYMAP[e.key];
  if(!k) return;
  e.preventDefault();
  keys.delete(k);
});

cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

cv.addEventListener('pointerdown', function(e){
  if(G.state !== 'play') return;
  e.preventDefault();
  const side = e.clientX < CW * 0.5 ? -1 : 1;
  if(side === -1) turnLeft(); else turnRight();
  pointers.set(e.pointerId, side);
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});

cv.addEventListener('pointermove', function(e){
  if(!pointers.has(e.pointerId)) return;
  e.preventDefault();
  const side = e.clientX < CW * 0.5 ? -1 : 1;
  if(pointers.get(e.pointerId) !== side){
    pointers.set(e.pointerId, side);
    if(side === -1) turnLeft(); else turnRight();
  }
});

function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
}
cv.addEventListener('pointerup',     endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave',  endPointer);

/* ============================================================= */
/*  CORRIDOR PATH GENERATION                                     */
/* ============================================================= */
function attemptWalk(targetLen, N){
  const visited = new Set();
  const out = [];

  const edge = Math.floor(Math.random() * 4);
  let sx, sy;
  if(edge === 0){ sx = Math.floor(Math.random() * N); sy = 0; }
  else if(edge === 1){ sx = N - 1; sy = Math.floor(Math.random() * N); }
  else if(edge === 2){ sx = Math.floor(Math.random() * N); sy = N - 1; }
  else { sx = 0; sy = Math.floor(Math.random() * N); }

  visited.add(sy * N + sx);
  out.push([sx, sy]);

  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

  while(out.length < targetLen){
    const last = out[out.length - 1];
    const cx = last[0], cy = last[1];
    const opts = [];

    for(let d = 0; d < 4; d++){
      const nx = cx + dirs[d][0];
      const ny = cy + dirs[d][1];
      if(nx < 0 || nx >= N || ny < 0 || ny >= N) continue;
      if(visited.has(ny * N + nx)) continue;

      let ok = true;
      for(let e = 0; e < 4; e++){
        const ax = nx + dirs[e][0];
        const ay = ny + dirs[e][1];
        if(ax === cx && ay === cy) continue;
        if(ax < 0 || ax >= N || ay < 0 || ay >= N) continue;
        if(visited.has(ay * N + ax)){ ok = false; break; }
      }
      if(ok) opts.push([nx, ny]);
    }

    if(opts.length === 0) break;

    const pick = opts[(Math.random() * opts.length) | 0];
    visited.add(pick[1] * N + pick[0]);
    out.push(pick);
  }

  return out;
}

function generateCorridor(targetLen, N, attempts){
  let best = null;
  for(let i = 0; i < attempts; i++){
    const p = attemptWalk(targetLen, N);
    if(!best || p.length > best.length) best = p;
    if(best.length >= targetLen) break;
  }
  return best || [[0,0],[0,1],[0,2],[0,3]];
}

/* ============================================================= */
/*  BUILD LEVEL                                                  */
/* ============================================================= */
function buildLevel(){
  hideAllButtons();
  resetTimerCache();
  pickColors();

  const level = G.level;

  /* level length grows at half the original rate */
  const targetLen = Math.round(12 + (level - 1) * 2.5);
  const N = Math.max(10, Math.ceil(Math.sqrt(targetLen) * 3.5)) + 4;

  W = N; H = N;

  /* corridor narrows at half the original rate */
  s = Math.max(90, 200 * Math.pow(0.985, level - 1));

  wallGlowW = Math.max(5,   s * 0.05);
  wallCoreW = Math.max(1.2, s * 0.01);

  /* speed grows at half the original rate */
  G.maxSpeed = Math.round((132 + level * 3.5) * 1.5 * (s / 200));

  path = generateCorridor(targetLen, N, 300);
  if(path.length < 4){
    path = [[0,0],[1,0],[2,0],[3,0],[4,0]];
  }

  pathIdxMap = new Map();
  for(let i = 0; i < path.length; i++){
    pathIdxMap.set(path[i][1] * N + path[i][0], i);
  }

  startCell = { x: path[0][0], y: path[0][1] };
  goalCell  = { x: path[path.length-1][0], y: path[path.length-1][1] };

  goalX = (goalCell.x + 0.5) * s;
  goalY = (goalCell.y + 0.5) * s;

  /* PAR time: 15% more generous than the raw estimate */
  {
    const cellTime = s / G.maxSpeed;
    const basePar  = path.length * cellTime * 0.62 + 0.6;
    G.parTime = basePar * 1.15;
  }

  /* stars — only in the void outside the maze */
  generateStars();

  /* walls: 4 sides of each path cell minus openings */
  segs = [];
  for(let i = 0; i < path.length; i++){
    const cx = path[i][0], cy = path[i][1];
    const prev = i > 0             ? path[i-1] : null;
    const next = i < path.length-1 ? path[i+1] : null;

    const X = cx * s, Y = cy * s;

    const openN = (prev && prev[0] === cx     && prev[1] === cy - 1) ||
                  (next && next[0] === cx     && next[1] === cy - 1);
    const openS = (prev && prev[0] === cx     && prev[1] === cy + 1) ||
                  (next && next[0] === cx     && next[1] === cy + 1);
    const openW = (prev && prev[0] === cx - 1 && prev[1] === cy    ) ||
                  (next && next[0] === cx - 1 && next[1] === cy    );
    const openE = (prev && prev[0] === cx + 1 && prev[1] === cy    ) ||
                  (next && next[0] === cx + 1 && next[1] === cy    );

    if(!openN) segs.push(X,     Y,     X + s, Y    );
    if(!openS) segs.push(X,     Y + s, X + s, Y + s);
    if(!openW) segs.push(X,     Y,     X,     Y + s);
    if(!openE) segs.push(X + s, Y,     X + s, Y + s);
  }

  buildBuckets();

  /* start direction */
  const rdx = path[1][0] - path[0][0];
  const rdy = path[1][1] - path[0][1];
  if(rdx === 1)       player.dir = 0;
  else if(rdx === -1) player.dir = 2;
  else if(rdy === 1)  player.dir = 1;
  else                player.dir = 3;
  player.ang = DIR_ANG[player.dir];
  visAng     = player.ang;

  player.x = (startCell.x + 0.5) * s;
  player.y = (startCell.y + 0.5) * s;

  /* goal wall */
  {
    const last = path[path.length - 1];
    const prev = path[path.length - 2];
    const dx = last[0] - prev[0];
    const dy = last[1] - prev[1];
    const LX = last[0] * s, LY = last[1] * s;
    if(dx === 1)       goalWall = [LX + s, LY,     LX + s, LY + s];
    else if(dx === -1) goalWall = [LX,     LY,     LX,     LY + s];
    else if(dy === 1)  goalWall = [LX,     LY + s, LX + s, LY + s];
    else               goalWall = [LX,     LY,     LX + s, LY    ];
  }

  trail = [{ x: player.x, y: player.y }];

  cam.x = player.x - CW / 2;
  cam.y = player.y - CH / 2;

  navCell.x = -1; navCell.y = -1;
  navAngle = player.ang;
  navAngleTarget = navAngle;

  shockwaves.length = 0;
  boostTime = 0;
  boostPrev = false;
  boostGlow = 0;
  boostRamp = 0;
  G.boosting = false;

  keys.clear(); pointers.clear();

  G.levelTime   = 0;
  G.state       = 'play';
  G.shake       = 0;
  G.comboBroken = false;
}

/* ------------------------------------------------------------- */
/*  spatial buckets for walls                                    */
/* ------------------------------------------------------------- */
function bucketKey(cx, cy){
  return (cx + 4096) * 8192 + (cy + 4096);
}

function buildBuckets(){
  buckets = new Map();
  for(let i = 0; i < segs.length; i += 4){
    const x1 = segs[i],   y1 = segs[i+1];
    const x2 = segs[i+2], y2 = segs[i+3];

    const minx = Math.min(x1, x2) - BPAD, maxx = Math.max(x1, x2) + BPAD;
    const miny = Math.min(y1, y2) - BPAD, maxy = Math.max(y1, y2) + BPAD;

    const c0 = Math.floor(minx / BUCKET), c1 = Math.floor(maxx / BUCKET);
    const r0 = Math.floor(miny / BUCKET), r1 = Math.floor(maxy / BUCKET);

    for(let cx = c0; cx <= c1; cx++){
      for(let cy = r0; cy <= r1; cy++){
        const k = bucketKey(cx, cy);
        let arr = buckets.get(k);
        if(!arr){ arr = []; buckets.set(k, arr); }
        arr.push(i);
      }
    }
  }
}

const EMPTY = [];
function bucketAt(x, y){
  const arr = buckets.get(bucketKey(Math.floor(x / BUCKET), Math.floor(y / BUCKET)));
  return arr || EMPTY;
}

/* ============================================================= */
/*  COLLISION                                                    */
/* ============================================================= */
function hitsWall(px, py){
  const r = player.r, r2 = r * r;
  const arr = bucketAt(px, py);

  for(let i = 0; i < arr.length; i++){
    const j = arr[i];
    const x1 = segs[j],   y1 = segs[j+1];
    const x2 = segs[j+2], y2 = segs[j+3];

    if(px < (x1 < x2 ? x1 : x2) - r) continue;
    if(px > (x1 > x2 ? x1 : x2) + r) continue;
    if(py < (y1 < y2 ? y1 : y2) - r) continue;
    if(py > (y1 > y2 ? y1 : y2) + r) continue;

    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    let t = len2 > 0 ? ((px - x1)*dx + (py - y1)*dy) / len2 : 0;
    if(t < 0) t = 0; else if(t > 1) t = 1;

    const ex = px - (x1 + dx * t);
    const ey = py - (y1 + dy * t);
    if(ex*ex + ey*ey < r2) return true;
  }
  return false;
}

function distToGoalWall(){
  if(!goalWall) return 1e9;
  const x1 = goalWall[0], y1 = goalWall[1];
  const x2 = goalWall[2], y2 = goalWall[3];
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  let t = len2 > 0 ? ((player.x - x1)*dx + (player.y - y1)*dy) / len2 : 0;
  if(t < 0) t = 0; else if(t > 1) t = 1;
  const ex = player.x - (x1 + dx * t);
  const ey = player.y - (y1 + dy * t);
  return Math.sqrt(ex*ex + ey*ey);
}

/* ============================================================= */
/*  NAVIGATOR                                                    */
/* ============================================================= */
function updateNavigator(){
  const pcx = Math.floor(player.x / s);
  const pcy = Math.floor(player.y / s);
  if(pcx === navCell.x && pcy === navCell.y) return;
  navCell.x = pcx; navCell.y = pcy;

  const idx = pathIdxMap.get(pcy * W + pcx);
  if(idx === undefined) return;

  const L = path.length;

  let fromIdx, toIdx;
  if(idx + 2 <= L - 1){
    fromIdx = idx + 1;
    toIdx   = idx + 2;
  } else if(idx + 1 <= L - 1){
    fromIdx = idx;
    toIdx   = idx + 1;
  } else {
    return;
  }

  const dx = path[toIdx][0] - path[fromIdx][0];
  const dy = path[toIdx][1] - path[fromIdx][1];

  if(dx > 0)       navAngleTarget = 0;
  else if(dx < 0)  navAngleTarget = Math.PI;
  else if(dy > 0)  navAngleTarget = Math.PI / 2;
  else if(dy < 0)  navAngleTarget = -Math.PI / 2;
}

/* ============================================================= */
/*  COMBO                                                        */
/* ============================================================= */
function refreshCombo(pop){
  if(G.combo > 0){
    comboEl.textContent = 'x' + G.combo;
    comboEl.classList.add('on');
  } else {
    comboEl.textContent = '';
    comboEl.classList.remove('on');
  }

  if(pop && G.combo > 0){
    comboEl.classList.remove('pop');
    void comboEl.offsetWidth;
    comboEl.classList.add('pop');
  }

  /* music follows the streak */
  updateMusicMix(false);
}

function breakCombo(){
  const had = G.combo > 0;
  G.combo = 0;
  refreshCombo(false);          /* -> updateMusicMix resets every stem */
  return had;
}

/*  EVENTS                                                       */
/* ============================================================= */
let msgTimeout = 0;
function showMsg(text){
  msgEl.textContent = text;
  msgEl.classList.add('on');
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(function(){ msgEl.classList.remove('on'); }, 480);
}

function crash(){
  G.state = 'dead';
  G.boosting = false;
  G.shake = 10;
  showMsg('CRASH');
  showPrimary('RESTART', 'restart');
  showSecondary('MAIN MENU', 'menu');
}

function win(){
  G.state = 'win';
  G.boosting = false;

  if(!G.comboBroken && G.levelTime <= G.parTime){
    G.combo++;
    refreshCombo(true);
  }

  showPrimary('CONTINUE', 'continue');
  hideSecondary();
}

function resetLevel(){
  hideAllButtons();
  resetTimerCache();

  player.x = (startCell.x + 0.5) * s;
  player.y = (startCell.y + 0.5) * s;

  const rdx = path[1][0] - path[0][0];
  const rdy = path[1][1] - path[0][1];
  if(rdx === 1)       player.dir = 0;
  else if(rdx === -1) player.dir = 2;
  else if(rdy === 1)  player.dir = 1;
  else                player.dir = 3;
  player.ang = DIR_ANG[player.dir];
  visAng     = player.ang;

  trail = [{ x: player.x, y: player.y }];

  cam.x = player.x - CW / 2;
  cam.y = player.y - CH / 2;

  navCell.x = -1; navCell.y = -1;
  navAngle = player.ang;
  navAngleTarget = navAngle;

  shockwaves.length = 0;
  boostTime = 0;
  boostPrev = false;
  boostGlow = 0;
  boostRamp = 0;
  G.boosting = false;

  G.levelTime   = 0;
  G.state       = 'play';
  G.shake       = 0;
  G.comboBroken = false;
}

function goToMenu(){
  /* fresh run from the start screen */
  G.level = 1;
  G.combo = 0;
  refreshCombo(false);
  hideAllButtons();
  setMusicOn(false);
  buildLevel();          /* builds new maze + stars, sets state to 'play' */
  G.state = 'menu';      /* override: back to the menu */
  G.levelTime = 0;
  resetTimerCache();
  showPrimary('START', 'start');
  hideSecondary();
}

/* ============================================================= */
/*  UPDATE                                                       */
/* ============================================================= */
function update(dt){
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt * 42);

  /* tween navigator angle */
  {
    let ndiff = navAngleTarget - navAngle;
    while(ndiff >  Math.PI) ndiff -= Math.PI * 2;
    while(ndiff < -Math.PI) ndiff += Math.PI * 2;
    navAngle += ndiff * (1 - Math.exp(-14 * dt));
  }

  /* tween visual player angle */
  {
    let adiff = player.ang - visAng;
    while(adiff >  Math.PI) adiff -= Math.PI * 2;
    while(adiff < -Math.PI) adiff += Math.PI * 2;
    visAng += adiff * (1 - Math.exp(-26 * dt));
  }

  /* hold detection */
  let leftHeld  = keys.has('left');
  let rightHeld = keys.has('right');

  pointers.forEach(function(side){
    if(side === -1) leftHeld = true;
    else if(side === 1) rightHeld = true;
  });

  const bothHeld = leftHeld && rightHeld;

  /* boost + ramp + shockwave */
  if(bothHeld && G.state === 'play'){
    if(!boostPrev){
      shockwaves.push({
        x: player.x,
        y: player.y,
        t: 0,
        dur: 0.42,
        maxR: Math.max(30, s * 0.42)
      });
      G.shake = Math.max(G.shake, 3);
      boostGlow = 1;
      boostRamp = 0;
    }
    boostTime = BOOST_HOLD_REFRESH;
    boostRamp = Math.min(BOOST_RAMP_MAX, boostRamp + BOOST_RAMP_RATE * dt);
  }
  boostPrev = bothHeld;

  if(boostTime > 0) boostTime -= dt;
  else boostRamp = 0;
  if(boostGlow > 0) boostGlow = Math.max(0, boostGlow - dt * 2.4);

  const boosting = boostTime > 0 && G.state === 'play';
  G.boosting = boosting;

  /* shockwave update */
  for(let i = shockwaves.length - 1; i >= 0; i--){
    shockwaves[i].t += dt;
    if(shockwaves[i].t >= shockwaves[i].dur) shockwaves.splice(i, 1);
  }

  /* movement */
  if(G.state === 'play'){
    G.levelTime += dt;

    if(!G.comboBroken && G.levelTime > G.parTime){
      G.comboBroken = true;
      if(breakCombo()) showMsg('COMBO LOST');
      else             showMsg('TIME UP');
    }

    const mul   = boosting ? currentBoostMult() : 1;
    const speed = G.maxSpeed * mul;
    const dirv  = DIR_VEC[player.dir];
    const dx    = dirv[0] * speed * dt;
    const dy    = dirv[1] * speed * dt;

    const dist  = Math.abs(dx) + Math.abs(dy);
    const steps = Math.max(1, Math.ceil(dist / 3));

    for(let i = 0; i < steps; i++){
      player.x += dx / steps;
      player.y += dy / steps;

      if(distToGoalWall() < player.r + 5){ win(); return; }

      if(hitsWall(player.x, player.y)){ crash(); return; }
    }

    /* trail */
    const lastT = trail[trail.length - 1];
    const tdx = player.x - lastT.x;
    const tdy = player.y - lastT.y;
    if(tdx*tdx + tdy*tdy > 14){
      trail.push({ x: player.x, y: player.y });
      if(trail.length > 3000) trail.shift();
    }

    updateNavigator();
  }

  /* camera */
  {
    const camTargetX = player.x - CW / 2;
    const camTargetY = player.y - CH / 2;
    const ck = 1 - Math.exp(-7 * dt);
    cam.x += (camTargetX - cam.x) * ck;
    cam.y += (camTargetY - cam.y) * ck;
  }
}

/* ============================================================= */
/*  RENDER                                                       */
/* ============================================================= */
function render(){
  const r = octx;

  r.fillStyle = bgBase;
  r.fillRect(0, 0, CW, CH);

  let shakeX = 0, shakeY = 0;
  if(G.shake > 0.2){
    shakeX = (Math.random() - 0.5) * G.shake;
    shakeY = (Math.random() - 0.5) * G.shake;
  }

  const camX = cam.x + shakeX;
  const camY = cam.y + shakeY;

  const vL = camX - 16, vR = camX + CW + 16;
  const vT = camY - 16, vB = camY + CH + 16;

  r.lineCap  = 'round';
  r.lineJoin = 'round';

  /* ---------------- stars ---------------- */
  {
    const speed  = G.maxSpeed * (G.boosting ? currentBoostMult() : 1);
    const dirv   = DIR_VEC[player.dir];
    const smear  = Math.min(48, Math.max(0, (speed - 80) * 0.10));
    const useSmear = smear > 1.5;

    for(let i = 0; i < stars.length; i++){
      const st = stars[i];
      const sx = st.x - camX;
      const sy = st.y - camY;
      if(sx < -smear - 12 || sx > CW + smear + 12 || sy < -smear - 12 || sy > CH + smear + 12) continue;

      if(useSmear){
        r.beginPath();
        r.moveTo(sx, sy);
        r.lineTo(sx - dirv[0] * smear, sy - dirv[1] * smear);
        r.strokeStyle = 'rgba(255,255,255,' + (st.a * 0.8) + ')';
        r.lineWidth = st.s;
        r.stroke();
      } else {
        r.fillStyle = 'rgba(255,255,255,' + st.a + ')';
        r.fillRect(sx - st.s/2, sy - st.s/2, st.s, st.s);
      }
    }
  }

  /* ---------------- walls ---------------- */
  const wp = new Path2D();
  let visible = 0;

  for(let i = 0; i < segs.length; i += 4){
    const x1 = segs[i],   y1 = segs[i+1];
    const x2 = segs[i+2], y2 = segs[i+3];

    if(x1 < vL && x2 < vL) continue;
    if(x1 > vR && x2 > vR) continue;
    if(y1 < vT && y2 < vT) continue;
    if(y1 > vB && y2 > vB) continue;

    wp.moveTo(x1 - camX, y1 - camY);
    wp.lineTo(x2 - camX, y2 - camY);
    visible++;
  }

  if(visible){
    r.strokeStyle = wallGlow;
    r.lineWidth = wallGlowW;
    r.stroke(wp);

    r.strokeStyle = wallColor;
    r.lineWidth = wallCoreW;
    r.stroke(wp);
  }

  /* ---------------- finish wall ---------------- */
  if(goalWall){
    const pulse = 0.55 + 0.45 * Math.sin(G.levelTime * 4);
    r.save();
    r.shadowColor = accent;
    r.shadowBlur  = 18 + pulse * 16;
    r.strokeStyle = '#ffffff';
    r.lineWidth   = Math.max(2.5, s * 0.02);
    r.lineCap     = 'round';
    r.beginPath();
    r.moveTo(goalWall[0] - camX, goalWall[1] - camY);
    r.lineTo(goalWall[2] - camX, goalWall[3] - camY);
    r.stroke();

    r.shadowBlur  = 34 + pulse * 22;
    r.globalAlpha = 0.55;
    r.beginPath();
    r.moveTo(goalWall[0] - camX, goalWall[1] - camY);
    r.lineTo(goalWall[2] - camX, goalWall[3] - camY);
    r.stroke();
    r.restore();
    r.globalAlpha = 1;
  }

  /* ---------------- trail ---------------- */
  if(trail.length > 1){
    r.beginPath();
    r.moveTo(trail[0].x - camX, trail[0].y - camY);
    for(let i = 1; i < trail.length; i++){
      r.lineTo(trail[i].x - camX, trail[i].y - camY);
    }
    r.lineTo(player.x - camX, player.y - camY);

    if(G.boosting){
      const t = Math.min(1, boostRamp / BOOST_RAMP_MAX);
      r.lineWidth   = 2.0 + t * 1.4;
      r.strokeStyle = 'hsla(' + hue + ',95%,' + (72 + t * 15) + '%,0.95)';
    } else {
      r.lineWidth   = 1.4;
      r.strokeStyle = 'rgba(255,255,255,0.85)';
    }
    r.lineCap     = 'round';
    r.lineJoin    = 'round';
    r.stroke();
  }

  /* ---------------- shockwaves ---------------- */
  for(let i = 0; i < shockwaves.length; i++){
    const sw = shockwaves[i];
    const p  = sw.t / sw.dur;
    const e  = 1 - Math.pow(1 - p, 2);
    const rad = sw.maxR * e;
    const a  = 1 - p;

    const sx = sw.x - camX;
    const sy = sw.y - camY;

    r.save();
    r.shadowColor = accent;
    r.shadowBlur  = 16;

    r.strokeStyle = 'hsla(' + hue + ',95%,72%,' + (a * 0.9) + ')';
    r.lineWidth   = 1 + 3.6 * (1 - p);
    r.beginPath();
    r.arc(sx, sy, rad, 0, Math.PI * 2);
    r.stroke();

    r.globalAlpha = a * 0.45;
    r.lineWidth   = 1;
    r.beginPath();
    r.arc(sx, sy, rad * 0.62, 0, Math.PI * 2);
    r.stroke();

    r.restore();
  }

  /* ---------------- player ---------------- */
  const px = player.x - camX;
  const py = player.y - camY;

  r.save();
  r.translate(px, py);
  r.rotate(visAng);

  if(boostGlow > 0.03){
    r.shadowColor = accent;
    r.shadowBlur  = 8 + boostGlow * 20;
  } else {
    r.shadowColor = '#ffffff';
    r.shadowBlur  = 8;
  }
  r.fillStyle = '#ffffff';

  r.beginPath();
  r.moveTo( 5.0,  0);
  r.lineTo(-3.4, -3.2);
  r.lineTo(-1.6,  0);
  r.lineTo(-3.4,  3.2);
  r.closePath();
  r.fill();
  r.restore();

  /* warp to display canvas */
  ctx.fillStyle = bgBase;
  ctx.fillRect(0, 0, CW, CH);
  warpBlit();

  /* navigator (UI) */
  renderNavigator();
}

function renderNavigator(){
  const cx = CW - 48;
  const cy = 48;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(navAngle);

  ctx.shadowColor = accent;
  ctx.shadowBlur  = 12;
  ctx.fillStyle   = accent;

  ctx.beginPath();
  ctx.moveTo( 12,  0);
  ctx.lineTo(-7.5, -9);
  ctx.lineTo(-3.2,  0);
  ctx.lineTo(-7.5,  9);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  ctx.shadowBlur = 0;
}

/* ============================================================= */
/*  HUD                                                          */
/* ============================================================= */
let hudCache = '';
function updateHud(){
  const str = 'LEVEL <b>' + G.level + '</b>';
  if(str !== hudCache){
    hudCache = str;
    hudEl.innerHTML = str;
    const b = hudEl.querySelector('b');
    if(b) b.style.color = accent;
  }
}

function formatTime(t){
  const total = Math.max(0, Math.floor(t * 1000));
  const secs  = Math.floor(total / 1000);
  const ms    = total % 1000;
  return (secs < 10 ? '0' : '') + secs + ':' +
         (ms < 100 ? (ms < 10 ? '00' : '0') : '') + ms;
}

let curCache = '', parCache = '', minCache = '', overCache = null, barCache = -1;

function resetTimerCache(){
  curCache = ''; parCache = ''; minCache = '';
  overCache = null; barCache = -1;
  tbarFil.style.width = '100%';
  tbarFil.style.background = accent;
  tMinEl.classList.remove('over');
}

function updateTimer(){
  const curStr = formatTime(G.levelTime);
  if(curStr !== curCache){ curCache = curStr; tCurEl.textContent = curStr; }

  const parStr = formatTime(G.parTime);
  if(parStr !== parCache){ parCache = parStr; tParEl.textContent = '/ ' + parStr; }

  const remain = G.parTime - G.levelTime;
  const over   = remain < 0;
  const minStr = (over ? 'T+' : 'T-') + formatTime(Math.abs(remain));
  if(minStr !== minCache){ minCache = minStr; tMinEl.textContent = minStr; }

  if(over !== overCache){
    overCache = over;
    tMinEl.classList.toggle('over', over);
    tbarFil.style.background = over ? '#ff5566' : accent;
  }

  let frac = G.parTime > 0 ? (G.parTime - G.levelTime) / G.parTime : 0;
  if(frac < 0) frac = 0;
  else if(frac > 1) frac = 1;

  const pct = Math.round(frac * 1000) / 10;
  if(pct !== barCache){
    barCache = pct;
    tbarFil.style.width = pct + '%';
  }
}

/* ============================================================= */
/*  MAIN LOOP                                                    */
/* ============================================================= */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();
  updateHud();
  updateTimer();

  requestAnimationFrame(frame);
}

/* ============================================================= */
/*  BOOT                                                         */
/* ============================================================= */
resize();
buildLevel();          /* builds the first maze + stars (state gets set to play inside) */
G.state = 'menu';      /* ...but we want the start screen first */
G.levelTime = 0;
resetTimerCache();
refreshCombo(false);
showPrimary('START', 'start');
hideSecondary();
requestAnimationFrame(frame);

})();
</script>
</body>
